          - PrivacyInfo.xcprivacy
          - Resources/InfoPlist.xcstrings
      - path: SalahIOSShared/IOSSharedPreferencesStore.swift
      - path: SalahIOS/Data/IOSPreferencesRepository.swift
      - path: SalahIOS/Domain/IOSAppStore.swift
      - path: SalahIOS/Features/Today/IOSPrayerPresentation.swift
      - path: SalahIOS/Data/Audio/IOSAudioFiles.swift
      - path: SalahIOSShared/ActivityPlaybackSession.swift
      - path: SalahIOSShared/WatchPreferencesMessage.swift
      - path: SalahIOS/Resources/Audio/adhan-ahmed-khalaf.mp3
        buildPhase: resources
      - path: SalahIOS/Resources/Audio/fajr-adhan-ahmed-khalaf.mp3
        buildPhase: resources
      - path: SalahWatchWidgets/WatchComplication.swift
      - path: SalahIOSWidgets/IOSAccessoryCopy.swift
      - path: SalahIOSWidgets/PrayerGlyph.swift
      - path: SalahWatchTests
    dependencies:

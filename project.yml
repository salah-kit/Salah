# Generates Salah.xcodeproj. Run `xcodegen` in this folder after changing it or adding,
# moving or removing a source file, and commit both (STANDARD.md, Apps).
#
# Every setting is written out here (no XcodeGen presets), so this file is the whole build
# configuration. Signing comes from Config/Shared.xcconfig and your own Config/Local.xcconfig.
name: Salah
options:
  settingPresets: none
  developmentLanguage: en
  createIntermediateGroups: true
  xcodeVersion: "27.0"
attributes:
  ORGANIZATIONNAME: The Salah Kit Authors
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
packages:
  # SalahCalculation brings SalahTimes, the calculation engine, along with it.
  SalahKit:
    url: https://github.com/salah-kit/SalahKit
    from: 0.4.1
settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_ANALYZER_NONNULL: YES
    CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION: YES_AGGRESSIVE
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_OBJC_WEAK: YES
    CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: YES
    CLANG_WARN_BOOL_CONVERSION: YES
    CLANG_WARN_COMMA: YES
    CLANG_WARN_CONSTANT_CONVERSION: YES
    CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: YES
    CLANG_WARN_DIRECT_OBJC_ISA_USAGE: YES_ERROR
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_WARN_EMPTY_BODY: YES
    CLANG_WARN_ENUM_CONVERSION: YES
    CLANG_WARN_INFINITE_RECURSION: YES
    CLANG_WARN_INT_CONVERSION: YES
    CLANG_WARN_NON_LITERAL_NULL_CONVERSION: YES
    CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: YES
    CLANG_WARN_OBJC_LITERAL_CONVERSION: YES
    CLANG_WARN_OBJC_ROOT_CLASS: YES_ERROR
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    CLANG_WARN_RANGE_LOOP_ANALYSIS: YES
    CLANG_WARN_STRICT_PROTOTYPES: YES
    CLANG_WARN_SUSPICIOUS_MOVE: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    CLANG_WARN_UNREACHABLE_CODE: YES
    CLANG_WARN__DUPLICATE_METHOD_MATCH: YES
    COPY_PHASE_STRIP: NO
    ENABLE_STRICT_OBJC_MSGSEND: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    GCC_NO_COMMON_BLOCKS: YES
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    GCC_WARN_UNDECLARED_SELECTOR: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
    GCC_WARN_UNUSED_FUNCTION: YES
    GCC_WARN_UNUSED_VARIABLE: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MTL_FAST_MATH: YES
    SDKROOT: macosx
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      GCC_DYNAMIC_NO_PIC: NO
      GCC_OPTIMIZATION_LEVEL: "0"
      GCC_PREPROCESSOR_DEFINITIONS: ["DEBUG=1", "$(inherited)"]
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG $(inherited)
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_NS_ASSERTIONS: NO
      MTL_ENABLE_DEBUG_INFO: NO
      SWIFT_COMPILATION_MODE: wholemodule
# Portable app contracts are compiled into both iOS processes. The macOS-specific
# widget faces and Stop intent stay with the existing macOS targets.
targetTemplates:
  IOSShared:
    sources:
      - path: Shared/AppLanguage.swift
      - path: Shared/AppResources.swift
      - path: Shared/SalahSettings.swift
      - path: Shared/SalahPlayback.swift
      - path: Shared/SalahDisplay.swift
      - path: Shared/SalahPrayerSource.swift
      - path: Shared/SalahWidgetModels.swift
      - path: Shared/SalahWidgetTimeline.swift
      - path: Shared/SalahText.swift
      - path: Shared/SalahWidgetConstants.swift
      - path: Shared/WidgetUI/SalahPalette.swift
      - path: Shared/Glyphs.xcassets
      - path: SalahIOSShared
    dependencies:
      - package: SalahKit
        product: SalahCore
      - package: SalahKit
        product: SalahCalculation
      - package: SalahKit
        product: SalahWidgets
      - package: SalahKit
        product: SalahUI
      - package: SalahKit
        product: SalahAlerts
      - sdk: ActivityKit.framework
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
  # The Apple TV app and its Top Shelf extension compile the same portable models, the iOS
  # preferences contract and the token colors. tvOS has no WidgetKit, ActivityKit or
  # notification sounds, so none of the iOS system-surface code is included.
  TVShared:
    sources:
      - path: Shared/AppLanguage.swift
      - path: Shared/AppResources.swift
      - path: Shared/SalahSettings.swift
      - path: Shared/SalahPlayback.swift
      - path: Shared/SalahDisplay.swift
      - path: Shared/SalahPrayerSource.swift
      - path: Shared/SalahWidgetModels.swift
      - path: Shared/SalahText.swift
      - path: Shared/SalahWidgetConstants.swift
      - path: Shared/WidgetUI/SalahPalette.swift
      - path: Shared/Glyphs.xcassets
      - path: SalahIOSShared/IOSPreferences.swift
      - path: SalahIOSShared/IOSLocalization.swift
      - path: SalahIOS/Assets.xcassets
      - path: SalahTVShared
    dependencies:
      - package: SalahKit
        product: SalahCore
      - package: SalahKit
        product: SalahCalculation
      - package: SalahKit
        product: SalahWidgets
      - package: SalahKit
        product: SalahUI
    settings:
      base:
        SDKROOT: appletvos
        SUPPORTED_PLATFORMS: "appletvos appletvsimulator"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "3"
        TVOS_DEPLOYMENT_TARGET: "26.0"
  # The Apple Watch app and its complications compile the same portable models, the iOS
  # preferences contract and the token colors. The watch keeps its own copy of the
  # preferences the iPhone app sends it, so neither needs the iPhone to run.
  WatchShared:
    sources:
      - path: Shared/AppLanguage.swift
      - path: Shared/AppResources.swift
      - path: Shared/SalahSettings.swift
      - path: Shared/SalahPlayback.swift
      - path: Shared/SalahDisplay.swift
      - path: Shared/SalahPrayerSource.swift
      - path: Shared/SalahWidgetModels.swift
      - path: Shared/SalahWidgetTimeline.swift
      - path: Shared/SalahText.swift
      - path: Shared/SalahWidgetConstants.swift
      - path: Shared/WidgetUI/SalahPalette.swift
      - path: Shared/Glyphs.xcassets
      - path: SalahIOSShared/IOSPreferences.swift
      - path: SalahIOSShared/IOSLocalization.swift
      - path: SalahIOS/Assets.xcassets
      - path: SalahWatchShared
    dependencies:
      - package: SalahKit
        product: SalahCore
      - package: SalahKit
        product: SalahCalculation
      - package: SalahKit
        product: SalahWidgets
      - package: SalahKit
        product: SalahUI
    settings:
      base:
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "26.0"
targets:
  Salah:
    type: application
    platform: macOS
    sources:
      - path: Salah
        excludes:
          - Info.plist
      - path: Shared
      # The app icon, an Icon Composer document that Xcode compiles.
      - path: Design/AppIcon/Salah.icon
        type: file
        buildPhase: resources
    dependencies:
      - target: SalahWidgetsExtension
        codeSign: false
      - package: SalahKit
        product: SalahCore
      - package: SalahKit
        product: SalahCalculation
      - package: SalahKit
        product: SalahWidgets
      - package: SalahKit
        product: SalahUI
      - package: SalahKit
        product: SalahAlerts
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: Salah
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Salah/Salah.entitlements
        COMBINE_HIDPI_IMAGES: YES
        CURRENT_PROJECT_VERSION: "4"
        ENABLE_APP_SANDBOX: YES
        ENABLE_PREVIEWS: YES
        ENABLE_USER_SELECTED_FILES: readonly
        # Salah/Info.plist holds the app's own keys; Xcode generates the standard ones.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Salah/Info.plist
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
        MARKETING_VERSION: 1.1.2
        PRODUCT_BUNDLE_IDENTIFIER: io.github.salah-kit.Salah
        PRODUCT_NAME: $(TARGET_NAME)
        REGISTER_APP_GROUPS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_VERSION: "6.0"
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          ENABLE_HARDENED_RUNTIME: YES
  SalahWidgetsExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: SalahWidgetsExtension
        excludes:
          - Info.plist
      - path: Shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - package: SalahKit
        product: SalahCore
      - package: SalahKit
        product: SalahCalculation
      - package: SalahKit
        product: SalahWidgets
      - package: SalahKit
        product: SalahUI
    settings:
      base:
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        CODE_SIGN_ENTITLEMENTS: SalahWidgetsExtension/SalahWidgetsExtension.entitlements
        CURRENT_PROJECT_VERSION: "4"
        ENABLE_APP_SANDBOX: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SalahWidgetsExtension/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: SalahWidgetsExtension
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        LD_RUNPATH_SEARCH_PATHS:
          ["$(inherited)", "@executable_path/../Frameworks", "@executable_path/../../../../Frameworks"]
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        MARKETING_VERSION: 1.1.2
        PRODUCT_BUNDLE_IDENTIFIER: io.github.salah-kit.Salah.Widgets
        PRODUCT_NAME: $(TARGET_NAME)
        SDKROOT: macosx
        SKIP_INSTALL: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SUPPORTED_PLATFORMS: macosx
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_VERSION: "6.0"
  # Not hosted: the bundle compiles the app's sources itself and never launches the app,
  # so tests need no App Group, signing team or permissions. Baselines/ holds the PNGs the
  # visual tests compare against; they're read from the source tree, not bundled.
  SalahTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Salah
        excludes:
          - Assets.xcassets
          - Info.plist
          - Salah.entitlements
          - PrivacyInfo.xcprivacy
          - Resources/InfoPlist.xcstrings
      - path: Shared
      - path: SalahTests
        excludes:
          - Baselines
    dependencies:
      - package: SalahKit
        product: SalahCore
      - package: SalahKit
        product: SalahCalculation
      - package: SalahKit
        product: SalahWidgets
      - package: SalahKit
        product: SalahUI
      - package: SalahKit
        product: SalahAlerts
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        CURRENT_PROJECT_VERSION: "4"
        GENERATE_INFOPLIST_FILE: YES
        # The @objc name of the class in SalahTests/Support/TestEnvironment.swift.
        INFOPLIST_KEY_NSPrincipalClass: SalahTestEnvironment
        LD_RUNPATH_SEARCH_PATHS:
          ["$(inherited)", "@executable_path/../Frameworks", "@loader_path/../Frameworks"]
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        MARKETING_VERSION: 1.1.2
        PRODUCT_BUNDLE_IDENTIFIER: io.github.salah-kit.SalahTests
        PRODUCT_NAME: $(TARGET_NAME)
        SDKROOT: macosx
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: NO
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_VERSION: "6.0"
  # Drives the real app (XCUITest). It builds and launches the app, which opens its App
  # Group, so it needs a signing team (Config/Local.xcconfig) and has its own scheme: the
  # Salah scheme's tests never build the app. Its runner is signed with the team into the
  # same App Group, sandboxed, so the alert tests can read what the app publishes there.
  SalahUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: SalahUITests
        excludes:
          - SalahUITests.entitlements
      # The launch arguments the real-app tests use, shared rather than copied.
      - path: SalahRoundTripTests/LaunchArguments.swift
    dependencies:
      - target: Salah
      - package: SalahKit
        product: SalahCore
      - package: SalahKit
        product: SalahCalculation
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: SalahUITests/SalahUITests.entitlements
        CURRENT_PROJECT_VERSION: "4"
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS:
          ["$(inherited)", "@executable_path/../Frameworks", "@loader_path/../Frameworks"]
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        MARKETING_VERSION: 1.1.2
        PRODUCT_BUNDLE_IDENTIFIER: io.github.salah-kit.SalahUITests
        PRODUCT_NAME: $(TARGET_NAME)
        SDKROOT: macosx
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: Salah
  # A stand-in for the widget extension in SalahRoundTripTests: a background-only app
  # signed like the extension, in the same App Group, that runs the Stop intent's own
  # code. It's never embedded in Salah.app.
  SalahStopHarness:
    type: application
    platform: macOS
    sources:
      - path: SalahStopHarness
        excludes:
          - SalahStopHarness.entitlements
      - path: Shared
    dependencies:
      - package: SalahKit
        product: SalahCore
      - package: SalahKit
        product: SalahCalculation
      - package: SalahKit
        product: SalahWidgets
      - package: SalahKit
        product: SalahUI
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: SalahStopHarness/SalahStopHarness.entitlements
        CURRENT_PROJECT_VERSION: "4"
        ENABLE_APP_SANDBOX: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSBackgroundOnly: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        MARKETING_VERSION: 1.1.2
        PRODUCT_BUNDLE_IDENTIFIER: io.github.salah-kit.Salah.StopHarness
        PRODUCT_NAME: $(TARGET_NAME)
        SDKROOT: macosx
        SKIP_INSTALL: YES
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_VERSION: "6.0"
  # Runs the real, signed app and the stop harness as separate processes: the widget's
  # Stop code, a simulated sleep and a settings change. No host app, so it runs in
  # xctest outside any sandbox and can start, suspend and read them. It needs a signing
  # team (Config/Local.xcconfig) and has its own scheme; CI only builds it.
  SalahRoundTripTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SalahRoundTripTests
    dependencies:
      - target: Salah
        embed: false
        link: false
      - target: SalahStopHarness
        embed: false
        link: false
      - package: SalahKit
        product: SalahCore
      - package: SalahKit
        product: SalahCalculation
    settings:
      base:
        BUNDLE_LOADER: ""
        CODE_SIGN_IDENTITY: "-"
        CURRENT_PROJECT_VERSION: "4"
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS:
          ["$(inherited)", "@executable_path/../Frameworks", "@loader_path/../Frameworks"]
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        MARKETING_VERSION: 1.1.2
        PRODUCT_BUNDLE_IDENTIFIER: io.github.salah-kit.SalahRoundTripTests
        PRODUCT_NAME: $(TARGET_NAME)
        SDKROOT: macosx
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_VERSION: "6.0"
        TEST_HOST: ""
  SalahIOS:
    templates: [IOSShared]
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SalahIOS
        excludes:
          - Info.plist
          - SalahIOS.entitlements
          - Resources/Audio/NOTICE
      - path: SalahIOS/Resources/Audio/NOTICE
        type: file
        buildPhase: resources
      - path: Salah/Assets.xcassets
      - path: Design/AppIcon/Salah.icon
        type: file
        buildPhase: resources
    dependencies:
      - target: SalahIOSWidgets
        codeSign: false
      # The watch app ships inside the iPhone app, which sends it the preferences.
      - target: SalahWatch
        codeSign: false
    entitlements:
      path: SalahIOS/SalahIOS.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.security.application-groups:
          - group.io.github.salah-kit.Salah
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: Salah
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: SalahIOS/SalahIOS.entitlements
        CURRENT_PROJECT_VERSION: "4"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SalahIOS/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
        MARKETING_VERSION: 1.1.2
        PRODUCT_BUNDLE_IDENTIFIER: io.github.salah-kit.Salah.iOS
        PRODUCT_NAME: $(TARGET_NAME)
        REGISTER_APP_GROUPS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: YES
  SalahIOSWidgets:
    templates: [IOSShared]
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SalahIOSWidgets
        excludes:
          - Info.plist
          - SalahIOSWidgets.entitlements
      - path: SalahWidgetsExtension/Assets.xcassets
      - path: SalahIOS/Assets.xcassets
      - path: SalahIOS/Resources/Localizable.xcstrings
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        CODE_SIGN_ENTITLEMENTS: SalahIOSWidgets/SalahIOSWidgets.entitlements
        CURRENT_PROJECT_VERSION: "4"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SalahIOSWidgets/Info.plist
        LD_RUNPATH_SEARCH_PATHS:
          ["$(inherited)", "@executable_path/Frameworks", "@executable_path/../../Frameworks"]
        MARKETING_VERSION: 1.1.2
        PRODUCT_BUNDLE_IDENTIFIER: io.github.salah-kit.Salah.iOS.Widgets
        PRODUCT_NAME: $(TARGET_NAME)
        REGISTER_APP_GROUPS: YES
        SKIP_INSTALL: YES
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SALAH_WIDGET_EXTENSION"
        SWIFT_EMIT_LOC_STRINGS: YES
  # A non-hosted simulator bundle, like SalahTests: it compiles the app's sources
  # directly and exercises logic and adapters without a signed App Group or UI launch.
  SalahIOSTests:
    templates: [IOSShared]
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SalahIOS
        excludes:
          - Info.plist
          - SalahIOS.entitlements
          - PrivacyInfo.xcprivacy
      - path: SalahIOSTests
      - path: SalahIOSWidgets/IOSWidgetFaces.swift
      - path: SalahIOSWidgets/IOSWidgetSunArc.swift
      - path: SalahIOSWidgets/IOSPrayerWidget.swift
      - path: SalahIOSWidgets/IOSAccessoryCopy.swift
      - path: SalahIOSWidgets/PrayerGlyph.swift
      - path: SalahIOSWidgets/IOSPrayerLiveActivity.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        BUNDLE_LOADER: ""
        CODE_SIGN_IDENTITY: "-"
        CURRENT_PROJECT_VERSION: "4"
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS:
          ["$(inherited)", "@executable_path/Frameworks", "@loader_path/Frameworks"]
        MARKETING_VERSION: 1.1.2
        PRODUCT_BUNDLE_IDENTIFIER: io.github.salah-kit.Salah.iOS.Tests
        PRODUCT_NAME: $(TARGET_NAME)
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: NO
        TEST_HOST: ""
  SalahIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SalahIOSUITests
    dependencies:
      - target: SalahIOS
    settings:
      base:
        CURRENT_PROJECT_VERSION: "4"
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        LD_RUNPATH_SEARCH_PATHS:
          ["$(inherited)", "@executable_path/Frameworks", "@loader_path/Frameworks"]
        MARKETING_VERSION: 1.1.2
        PRODUCT_BUNDLE_IDENTIFIER: io.github.salah-kit.Salah.iOS.UITests
        PRODUCT_NAME: $(TARGET_NAME)
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: SalahIOS
  # The Apple TV app. It shares the iOS app's preferences, store and city search, and has its
  # own composition, services and views (SalahTV). The adhan plays only while it is open.
  SalahTV:
    templates: [TVShared]
    type: application
    platform: tvOS
    deploymentTarget: "26.0"
    sources:
      - path: SalahTV
        excludes:
          - Info.plist
          - SalahTV.entitlements
          - Resources/Audio/NOTICE
      # The licence notice of the bundled recordings, which About shows.
      - path: SalahTV/Resources/Audio/NOTICE
        type: file

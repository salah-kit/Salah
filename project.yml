        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "3"
        TEST_TARGET_NAME: SalahTV
        TVOS_DEPLOYMENT_TARGET: "26.0"
  # The Apple Watch app, the iPhone app's companion. It keeps the preferences the iPhone app
  # sends it, shares the iOS app's store, and has its own composition, services and views
  # (SalahWatch). The adhan plays only while it is open; the iPhone's alerts reach the watch.
  SalahWatch:
    templates: [WatchShared]
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: SalahWatch
        excludes:
          - Info.plist
          - SalahWatch.entitlements
      - path: SalahIOSShared/IOSSharedPreferencesStore.swift
      - path: SalahIOS/Data/IOSPreferencesRepository.swift
      - path: SalahIOS/Domain/IOSAppStore.swift
      - path: SalahIOS/Features/Today/IOSPrayerPresentation.swift
      - path: SalahIOS/Data/Audio/IOSAudioFiles.swift
      - path: SalahIOSShared/ActivityPlaybackSession.swift
      - path: SalahIOSShared/WatchPreferencesMessage.swift
      - path: SalahIOS/Resources/Audio/adhan-ahmed-khalaf.mp3
        buildPhase: resources
      - path: SalahIOS/Resources/Audio/fajr-adhan-ahmed-khalaf.mp3
        buildPhase: resources
      # The round watch icon of the app icon, an Icon Composer document that Xcode compiles.
      - path: Design/AppIcon/Salah.icon
        type: file
        buildPhase: resources
    dependencies:
      - target: SalahWatchWidgets
        codeSign: false
      - package: SalahKit
        product: SalahAlerts
    entitlements:
      path: SalahWatch/SalahWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.salah-kit.Salah
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: Salah
        # The app's tint, which the navigation titles take: the dark accent text color.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: SalahWatch/SalahWatch.entitlements
        CURRENT_PROJECT_VERSION: "4"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SalahWatch/Info.plist
        INFOPLIST_KEY_WKApplication: YES
        # The iPhone app owns the preferences, so the watch app installs with it.
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: io.github.salah-kit.Salah.iOS
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
        MARKETING_VERSION: 1.1.2
        PRODUCT_BUNDLE_IDENTIFIER: io.github.salah-kit.Salah.iOS.watchkitapp
        PRODUCT_NAME: $(TARGET_NAME)
        REGISTER_APP_GROUPS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: YES
  # The complications and the Smart Stack widget: the next prayer from the settings the watch
  # app mirrors into its App Group. It calculates its own schedule.
  SalahWatchWidgets:
    templates: [WatchShared]
    type: app-extension
    platform: watchOS

# Generates Salah.xcodeproj. Run `xcodegen` in this folder after changing it or adding,
# moving or removing a source file, and commit both (STANDARD.md, Apps).
#
# Every setting is written out here (no XcodeGen presets), so this file is the whole build
# configuration. Signing comes from Config/Shared.xcconfig and your own Config/Local.xcconfig.
name: Salah
options:
  settingPresets: none
  developmentLanguage: en
  createIntermediateGroups: true
  xcodeVersion: "27.0"
attributes:
  ORGANIZATIONNAME: The Salah Kit Authors
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
packages:
  adhan-swift:
    url: https://github.com/batoulapps/adhan-swift
    from: 1.0.0
settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_ANALYZER_NONNULL: YES
    CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION: YES_AGGRESSIVE
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_OBJC_WEAK: YES
    CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: YES
    CLANG_WARN_BOOL_CONVERSION: YES
    CLANG_WARN_COMMA: YES
    CLANG_WARN_CONSTANT_CONVERSION: YES
    CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: YES
    CLANG_WARN_DIRECT_OBJC_ISA_USAGE: YES_ERROR
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_WARN_EMPTY_BODY: YES
    CLANG_WARN_ENUM_CONVERSION: YES
    CLANG_WARN_INFINITE_RECURSION: YES
    CLANG_WARN_INT_CONVERSION: YES
    CLANG_WARN_NON_LITERAL_NULL_CONVERSION: YES
    CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: YES
    CLANG_WARN_OBJC_LITERAL_CONVERSION: YES
    CLANG_WARN_OBJC_ROOT_CLASS: YES_ERROR
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    CLANG_WARN_RANGE_LOOP_ANALYSIS: YES
    CLANG_WARN_STRICT_PROTOTYPES: YES
    CLANG_WARN_SUSPICIOUS_MOVE: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    CLANG_WARN_UNREACHABLE_CODE: YES
    CLANG_WARN__DUPLICATE_METHOD_MATCH: YES
    COPY_PHASE_STRIP: NO
    ENABLE_STRICT_OBJC_MSGSEND: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    GCC_NO_COMMON_BLOCKS: YES
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    GCC_WARN_UNDECLARED_SELECTOR: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
    GCC_WARN_UNUSED_FUNCTION: YES
    GCC_WARN_UNUSED_VARIABLE: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MTL_FAST_MATH: YES
    SDKROOT: macosx
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      GCC_DYNAMIC_NO_PIC: NO
      GCC_OPTIMIZATION_LEVEL: "0"
      GCC_PREPROCESSOR_DEFINITIONS: ["DEBUG=1", "$(inherited)"]
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG $(inherited)
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_NS_ASSERTIONS: NO
      MTL_ENABLE_DEBUG_INFO: NO
      SWIFT_COMPILATION_MODE: wholemodule
targets:
  Salah:
    type: application
    platform: macOS
    sources:
      - path: Salah
        excludes:
          - Info.plist
      - path: Shared
    dependencies:
      - target: SalahWidgetsExtension
        codeSign: false
      - package: adhan-swift
        product: Adhan
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Salah/Salah.entitlements
        COMBINE_HIDPI_IMAGES: YES
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_APP_SANDBOX: YES
        ENABLE_PREVIEWS: YES
        ENABLE_USER_SELECTED_FILES: readonly
        # Salah/Info.plist holds the app's own keys; Xcode generates the standard ones.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Salah/Info.plist
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
        MARKETING_VERSION: 1.0.0
        PRODUCT_BUNDLE_IDENTIFIER: io.github.salah-kit.Salah
        PRODUCT_NAME: $(TARGET_NAME)
        REGISTER_APP_GROUPS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_VERSION: "6.0"
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          ENABLE_HARDENED_RUNTIME: YES
  SalahWidgetsExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: SalahWidgetsExtension
        excludes:
          - Info.plist
      - path: Shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        CODE_SIGN_ENTITLEMENTS: SalahWidgetsExtension/SalahWidgetsExtension.entitlements
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_APP_SANDBOX: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SalahWidgetsExtension/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: SalahWidgetsExtension
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        LD_RUNPATH_SEARCH_PATHS:
          ["$(inherited)", "@executable_path/../Frameworks", "@executable_path/../../../../Frameworks"]
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        MARKETING_VERSION: 1.0.0
        PRODUCT_BUNDLE_IDENTIFIER: io.github.salah-kit.Salah.Widgets
        PRODUCT_NAME: $(TARGET_NAME)
        SDKROOT: macosx
        SKIP_INSTALL: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SUPPORTED_PLATFORMS: macosx
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_VERSION: "6.0"
  # Not hosted: the bundle compiles the app's sources itself and never launches the app,
  # so tests need no App Group, signing team or permissions. Baselines/ holds the PNGs the
  # visual tests compare against; they're read from the source tree, not bundled.
  SalahTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Salah
        excludes:
          - Assets.xcassets
          - Info.plist
          - Salah.entitlements
          - PrivacyInfo.xcprivacy
          - Resources/InfoPlist.xcstrings
      - path: Shared
      - path: SalahTests
        excludes:
          - Baselines
    dependencies:
      - package: adhan-swift
        product: Adhan
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        # The @objc name of the class in SalahTests/Support/TestEnvironment.swift.
        INFOPLIST_KEY_NSPrincipalClass: SalahTestEnvironment
        LD_RUNPATH_SEARCH_PATHS:
          ["$(inherited)", "@executable_path/../Frameworks", "@loader_path/../Frameworks"]
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        MARKETING_VERSION: 1.0.0
        PRODUCT_BUNDLE_IDENTIFIER: io.github.salah-kit.SalahTests
        PRODUCT_NAME: $(TARGET_NAME)
        SDKROOT: macosx
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: NO
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_VERSION: "6.0"
  # Drives the real app (XCUITest). It builds and launches the app, which opens its App
  # Group, so it needs a signing team (Config/Local.xcconfig) and has its own scheme: the
  # Salah scheme's tests never build the app.
  SalahUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: SalahUITests
    dependencies:
      - target: Salah
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS:
          ["$(inherited)", "@executable_path/../Frameworks", "@loader_path/../Frameworks"]
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        MARKETING_VERSION: 1.0.0
        PRODUCT_BUNDLE_IDENTIFIER: io.github.salah-kit.SalahUITests
        PRODUCT_NAME: $(TARGET_NAME)
        SDKROOT: macosx
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: Salah
schemes:
  Salah:
    build:
      # The test action builds only the test bundle: building the app registers it, and
      # its widget extension, with LaunchServices and PlugInKit.
      targets:
        Salah: [running, profiling, archiving, analyzing]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SalahTests
      # Pins the test process's languages, so the visual baselines don't depend on the
      # machine's language list (TestEnvironmentTests.processLanguagesArePinned).
      commandLineArguments:
        "-AppleLanguages (en-US)": true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  SalahUITests:
    build:
      targets:
        SalahUITests: [test]
    test:
      config: Debug
      targets:
        - SalahUITests

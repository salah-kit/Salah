        "-AppleLanguages (en-US)": true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  SalahTVUITests:
    build:
      targets:
        SalahTVUITests: [test]
    test:
      config: Debug
      targets:
        - SalahTVUITests
  SalahWatch:
    build:
      targets:
        SalahWatch: [running, profiling, archiving, analyzing]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SalahWatchTests
      commandLineArguments:

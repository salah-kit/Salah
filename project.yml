  # A non-hosted Apple TV simulator bundle, like SalahIOSTests: it compiles the app's sources
  # and the Top Shelf's shared code directly, without a signed App Group or a UI launch.
  SalahTVTests:
    templates: [TVShared]
    type: bundle.unit-test

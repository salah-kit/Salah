schemes:
  Salah:
    build:
      # The test action builds only the test bundle: building the app registers it, and
      # its widget extension, with LaunchServices and PlugInKit.
      targets:
        Salah: [running, profiling, archiving, analyzing]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SalahTests
      # Pins the test process's languages, so the visual baselines don't depend on the
      # machine's language list (TestEnvironmentTests.processLanguagesArePinned).
      commandLineArguments:
        "-AppleLanguages (en-US)": true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  SalahUITests:
    build:
      targets:
        SalahUITests: [test]
    test:
      config: Debug
      targets:
        - SalahUITests
  SalahRoundTripTests:
    build:
      targets:
        SalahRoundTripTests: [test]
    test:
      config: Debug
      targets:
        - SalahRoundTripTests
  SalahIOS:
    build:
      targets:
        SalahIOS: [running, profiling, archiving, analyzing]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SalahIOSTests
      commandLineArguments:
        "-AppleLanguages (en-US)": true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  SalahIOSUITests:
    build:

  SalahTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    deploymentTarget: "26.0"
    sources:
      - path: SalahTVUITests
    dependencies:
      - target: SalahTV
    settings:
      base:
        CURRENT_PROJECT_VERSION: "4"
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS:
          ["$(inherited)", "@executable_path/Frameworks", "@loader_path/Frameworks"]

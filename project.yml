        MARKETING_VERSION: 1.1.2
        PRODUCT_BUNDLE_IDENTIFIER: io.github.salah-kit.Salah.iOS.watchkitapp.Widgets
        PRODUCT_NAME: $(TARGET_NAME)
        REGISTER_APP_GROUPS: YES
        SKIP_INSTALL: YES
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        SWIFT_EMIT_LOC_STRINGS: YES
  # A non-hosted Apple Watch simulator bundle, like SalahTVTests: it compiles the app's
  # sources and the complications' views directly, without a signed App Group or a UI launch.
  SalahWatchTests:
    templates: [WatchShared]
    type: bundle.unit-test

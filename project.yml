      - path: SalahIOS/Data/Audio/IOSAudioFiles.swift
      - path: SalahIOSShared/ActivityPlaybackSession.swift
      - path: Shared/SalahWidgetTimeline.swift
      - path: SalahIOS/Resources/Audio/adhan-ahmed-khalaf.mp3
        buildPhase: resources
      - path: SalahIOS/Resources/Audio/fajr-adhan-ahmed-khalaf.mp3
        buildPhase: resources
    dependencies:

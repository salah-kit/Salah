name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    # Xcode 27.0 on macOS 27, the toolchain the visual baselines were recorded with,
    # so they're compared pixel for pixel here too. `xcode-27` is GitHub's image for it.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version

      # The app embeds the widget extension, so building the app builds both.
      - name: Build the app and the widget extension, unsigned
        run: |
          for configuration in Debug Release; do
            xcodebuild build -project Salah.xcodeproj -scheme Salah \
              -configuration "$configuration" -destination 'platform=macOS' \
              -derivedDataPath .derived CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM=
            test -d ".derived/Build/Products/$configuration/Salah.app/Contents/PlugIns/SalahWidgetsExtension.appex"
            # actool succeeds silently without the icon, so check the app carries it.
            test "$(plutil -extract CFBundleIconName raw -o - \
              ".derived/Build/Products/$configuration/Salah.app/Contents/Info.plist")" = Salah
          done

      # SalahTests is a non-hosted bundle: it compiles the app's sources and never
      # launches the app, so it needs no App Group or signing team.
      - name: Test
        run: |
          xcodebuild test -project Salah.xcodeproj -scheme Salah \
            -destination 'platform=macOS' -derivedDataPath .derived \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=

      # The app runs its menu in the language it's set to, so the Arabic dropdown's
      # baselines render in an Arabic process: -testLanguage replaces the scheme's
      # en-US pin. Runs after a failed Test step too, so both sets of failures show.
      - name: Test the Arabic menu baselines
        if: ${{ !cancelled() }}
        run: |
          xcodebuild test -project Salah.xcodeproj -scheme Salah \
            -destination 'platform=macOS' -derivedDataPath .derived \
            -only-testing:SalahTests/VisualBaselineTests -testLanguage ar \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=

      # Build-only: the UI tests launch the app, which opens its App Group container,
      # and only a build signed with a team's provisioning profile can do that without
      # macOS asking for permission. Hosted runners have no team. Run them locally with
      # the SalahUITests scheme (CONTRIBUTING.md).
      - name: Build the UI tests
        if: ${{ !cancelled() }}
        run: |
          xcodebuild build-for-testing -project Salah.xcodeproj -scheme SalahUITests \
            -destination 'platform=macOS' -derivedDataPath .derived CODE_SIGNING_ALLOWED=NO

      # Build-only for the same reason: the real-app tests run the signed app and the
      # stop harness, whose App Group needs a team's provisioning profile.
      - name: Build the real-app tests
        if: ${{ !cancelled() }}
        run: |
          xcodebuild build-for-testing -project Salah.xcodeproj -scheme SalahRoundTripTests \
            -destination 'platform=macOS' -derivedDataPath .derived CODE_SIGNING_ALLOWED=NO

      # The directory's name starts with a dot, so its files only upload with
      # include-hidden-files. It's absent when no baseline failed.
      - name: Upload renders that differ from the baselines
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: baseline-failures
          path: .baseline-failures
          include-hidden-files: true
          if-no-files-found: ignore

  ios-build-and-test:
    name: iOS (${{ matrix.family }})
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        family: [iPhone, iPad, Duo]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      # The iPhone job also builds the Release app and embedded widget for a
      # generic device, unsigned. Every family runs logic and real-app journeys;
      # Duo runs on iPhone Duo, which needs the iOS 27.1 simulator runtime.
      # The script creates and deletes its own simulator and needs no paid team.
      - name: Build and test iOS
        env:
          SALAH_IOS_SIMULATOR_FAMILY: ${{ matrix.family }}
        run: bash scripts/verify-ios.sh

      - name: Upload iOS test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-results-${{ matrix.family }}
          path: .derived/ios-${{ matrix.family }}/Results
          include-hidden-files: true
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test the simulator selection
        run: python3 -B -m unittest discover -s scripts

      - name: swift format lint
        run: |
          swift format lint --strict --recursive Salah SalahWidgetsExtension Shared \
            SalahTests SalahUITests SalahRoundTripTests SalahStopHarness \
            SalahIOS SalahIOSShared SalahIOSWidgets SalahIOSTests SalahIOSUITests

      - name: Check the flat app icon
        run: python3 Design/AppIcon/flatten_icon.py --check

      # Salah.xcodeproj is generated from project.yml; this fails when they differ. The
      # XcodeGen release is pinned by version and checksum, so its output can't drift.
      - name: Check the generated project
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --quiet
          changes="$(git status --porcelain -- Salah.xcodeproj)"
          if [[ -n "$changes" ]]; then
            echo "$changes"
            git diff -- Salah.xcodeproj
            echo "::error::Salah.xcodeproj differs from what project.yml generates. Run xcodegen and commit both."
            exit 1
          fi

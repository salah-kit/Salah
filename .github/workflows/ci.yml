name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    # Xcode 27.0 on macOS 27, the toolchain the visual baselines were recorded with,
    # so they're compared pixel for pixel here too. `xcode-27` is GitHub's image for it.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version

      # The app embeds the widget extension, so building the app builds both.
      - name: Build the app and the widget extension, unsigned
        run: |
          for configuration in Debug Release; do
            xcodebuild build -project Salah.xcodeproj -scheme Salah \
              -configuration "$configuration" -destination 'platform=macOS' \
              -derivedDataPath .derived CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM=
            test -d ".derived/Build/Products/$configuration/Salah.app/Contents/PlugIns/SalahWidgetsExtension.appex"
          done

      # SalahTests is a non-hosted bundle: it compiles the app's sources and never
      # launches the app, so it needs no App Group or signing team.
      - name: Test
        run: |
          xcodebuild test -project Salah.xcodeproj -scheme Salah \
            -destination 'platform=macOS' -derivedDataPath .derived \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=

      # The app runs its menu in the language it's set to, so the Arabic dropdown's
      # baselines render in an Arabic process: -testLanguage replaces the scheme's
      # en-US pin. Runs after a failed Test step too, so both sets of failures show.
      - name: Test the Arabic menu baselines
        if: ${{ !cancelled() }}
        run: |
          xcodebuild test -project Salah.xcodeproj -scheme Salah \
            -destination 'platform=macOS' -derivedDataPath .derived \
            -only-testing:SalahTests/VisualBaselineTests -testLanguage ar \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=

      # The directory's name starts with a dot, so its files only upload with
      # include-hidden-files. It's absent when no baseline failed.
      - name: Upload renders that differ from the baselines
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: baseline-failures
          path: .baseline-failures
          include-hidden-files: true
          if-no-files-found: ignore

  lint:
    name: Lint
    # Non-blocking for now: the imported code isn't formatted yet. B2 formats it with
    # the shared .swift-format and makes this job blocking.
    continue-on-error: true
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: swift format lint
        run: swift format lint --strict --recursive Salah SalahWidgetsExtension Shared SalahTests
